<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">What you pay for versus what you use</title>
  <desc id="d">A bar representing every feature in an off-the-shelf platform. A small highlighted portion at the start shows the features actually used. A dashed marker at one fifth shows the threshold where building becomes worth considering.</desc>
  <style>
    .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 19px; fill: #475569; }
    .cap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; letter-spacing: 1.6px; text-transform: uppercase; }
    .num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
    .sm  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #64748b; }
    .nvy { fill: #0f172a; }
  </style>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="80" y="96" class="cap">Everything in the platform you subscribe to</text>
  <rect x="80" y="210" width="1040" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="120" y1="210" x2="120" y2="302" stroke="#e2e8f0"/>
  <line x1="160" y1="210" x2="160" y2="302" stroke="#e2e8f0"/>
  <line x1="200" y1="210" x2="200" y2="302" stroke="#e2e8f0"/>
  <line x1="240" y1="210" x2="240" y2="302" stroke="#e2e8f0"/>
  <line x1="280" y1="210" x2="280" y2="302" stroke="#e2e8f0"/>
  <line x1="320" y1="210" x2="320" y2="302" stroke="#e2e8f0"/>
  <line x1="360" y1="210" x2="360" y2="302" stroke="#e2e8f0"/>
  <line x1="400" y1="210" x2="400" y2="302" stroke="#e2e8f0"/>
  <line x1="440" y1="210" x2="440" y2="302" stroke="#e2e8f0"/>
  <line x1="480" y1="210" x2="480" y2="302" stroke="#e2e8f0"/>
  <line x1="520" y1="210" x2="520" y2="302" stroke="#e2e8f0"/>
  <line x1="560" y1="210" x2="560" y2="302" stroke="#e2e8f0"/>
  <line x1="600" y1="210" x2="600" y2="302" stroke="#e2e8f0"/>
  <line x1="640" y1="210" x2="640" y2="302" stroke="#e2e8f0"/>
  <line x1="680" y1="210" x2="680" y2="302" stroke="#e2e8f0"/>
  <line x1="720" y1="210" x2="720" y2="302" stroke="#e2e8f0"/>
  <line x1="760" y1="210" x2="760" y2="302" stroke="#e2e8f0"/>
  <line x1="800" y1="210" x2="800" y2="302" stroke="#e2e8f0"/>
  <line x1="840" y1="210" x2="840" y2="302" stroke="#e2e8f0"/>
  <line x1="880" y1="210" x2="880" y2="302" stroke="#e2e8f0"/>
  <line x1="920" y1="210" x2="920" y2="302" stroke="#e2e8f0"/>
  <line x1="960" y1="210" x2="960" y2="302" stroke="#e2e8f0"/>
  <line x1="1000" y1="210" x2="1000" y2="302" stroke="#e2e8f0"/>
  <line x1="1040" y1="210" x2="1040" y2="302" stroke="#e2e8f0"/>
  <line x1="1080" y1="210" x2="1080" y2="302" stroke="#e2e8f0"/>
  <path d="M80 220 a10 10 0 0 1 10 -10 h135 v92 h-135 a10 10 0 0 1 -10 -10 z" fill="#3399f2"/>
  <path d="M152 314 v22" stroke="#3399f2" stroke-width="2"/>
  <text x="80" y="360" class="lbl" style="fill:#3399f2; font-weight:700">The features your team opens in a normal month</text>

  <line x1="288" y1="168" x2="288" y2="344" stroke="#f24d4d" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="302" y="158" class="cap" style="fill:#f24d4d">One fifth</text>
  <text x="80" y="394" class="sm" style="fill:#f24d4d">Below one fifth, the platform is shaped for someone else's business</text>

  <text x="80" y="476" class="cap">The comparison that matters</text>
  <text x="80" y="516" class="lbl">Subscription over three years, plus the weekly hours somebody spends</text>
  <text x="80" y="546" class="lbl">reshaping exports, against the cost of building the part you actually use.</text>
</svg>
