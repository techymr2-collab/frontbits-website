<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">One file becomes five</title>
  <desc id="d">A single spreadsheet on the left, with three copies branching from it. Two copies hold the same value; the third has diverged and is marked as not matching.</desc>
  <style>
    .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 19px; fill: #475569; }
    .cap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; letter-spacing: 1.6px; text-transform: uppercase; }
    .num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
    .sm  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #64748b; }
    .nvy { fill: #0f172a; }
  </style>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="80" y="86" class="cap">The file everyone shares</text>
  <rect x="80" y="112" width="300" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="80" y1="150" x2="380" y2="150" stroke="#e2e8f0"/>
  <line x1="80" y1="192" x2="380" y2="192" stroke="#e2e8f0"/>
  <line x1="80" y1="234" x2="380" y2="234" stroke="#e2e8f0"/>
  <line x1="80" y1="276" x2="380" y2="276" stroke="#e2e8f0"/>
  <line x1="80" y1="318" x2="380" y2="318" stroke="#e2e8f0"/>
  <line x1="80" y1="360" x2="380" y2="360" stroke="#e2e8f0"/>
  <line x1="155" y1="112" x2="155" y2="412" stroke="#e2e8f0"/>
  <line x1="230" y1="112" x2="230" y2="412" stroke="#e2e8f0"/>
  <line x1="305" y1="112" x2="305" y2="412" stroke="#e2e8f0"/>
  <text x="104" y="180" class="lbl nvy" style="font-weight:700">Acme</text>
  <text x="180" y="180" class="lbl">2,480</text>
  <text x="80" y="452" class="sm">One source of truth, in theory</text>
  <path d="M400 262 C 470 262, 470 168, 540 168" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="540" y="130" width="470" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="566" y="164" class="sm">Copy on the shared drive</text>
  <text x="566" y="192" class="lbl" style="font-weight:700; fill:#0f172a">2,480</text>
  <path d="M400 262 C 470 262, 470 286, 540 286" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="540" y="248" width="470" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="566" y="282" class="sm">Copy in someone's email</text>
  <text x="566" y="310" class="lbl" style="font-weight:700; fill:#0f172a">2,480</text>
  <path d="M400 262 C 470 262, 470 404, 540 404" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="540" y="366" width="470" height="78" rx="10" fill="#ffffff" stroke="#f24d4d"/>
  <text x="566" y="400" class="sm">Copy nobody knew about</text>
  <text x="566" y="428" class="lbl" style="font-weight:700; fill:#f24d4d">2,840</text>
  <rect x="836" y="404" width="150" height="28" rx="5" fill="#fbe4e4"/>
  <text x="911" y="423" class="sm" style="fill:#c23a3a; font-weight:700" text-anchor="middle">Doesn't match</text>
  <text x="540" y="510" class="sm">Every copy was rational on its own.</text>
</svg>
