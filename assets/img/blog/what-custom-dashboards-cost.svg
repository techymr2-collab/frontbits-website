<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">What moves the price of a custom build</title>
  <desc id="d">Four horizontal bars showing the relative weight of the cost drivers: modules is the largest, roles and permissions is larger than most people expect, and integrations and data migration are shown as ranges because they depend on the systems involved.</desc>
  <style>
    .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 19px; fill: #475569; }
    .cap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; letter-spacing: 1.6px; text-transform: uppercase; }
    .num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
    .sm  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #64748b; }
    .nvy { fill: #0f172a; }
  </style>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="80" y="88" class="cap">Relative weight, not absolute cost</text>
  <text x="80" y="162" class="lbl nvy" style="font-weight:700">Number of modules</text>
  <text x="80" y="190" class="sm">The single biggest driver</text>
  <rect x="430" y="136" width="620" height="46" rx="8" fill="#f8fafc"/>
  <rect x="430" y="136" width="570" height="46" rx="8" fill="#3399f2"/>
  <text x="80" y="264" class="lbl nvy" style="font-weight:700">Roles and permissions</text>
  <text x="80" y="292" class="sm">The most underestimated line</text>
  <rect x="430" y="238" width="620" height="46" rx="8" fill="#f8fafc"/>
  <rect x="430" y="238" width="384" height="46" rx="8" fill="#f2b326"/>
  <text x="80" y="366" class="lbl nvy" style="font-weight:700">Integrations</text>
  <text x="80" y="394" class="sm">Depends entirely on the target system</text>
  <rect x="430" y="340" width="620" height="46" rx="8" fill="#f8fafc"/>
  <rect x="430" y="340" width="186" height="46" rx="8" fill="#33cc66"/>
  <rect x="616" y="340" width="260" height="46" rx="8" fill="#33cc66" opacity="0.18"/>
  <line x1="876" y1="334" x2="876" y2="392" stroke="#33cc66" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="80" y="468" class="lbl nvy" style="font-weight:700">Data migration</text>
  <text x="80" y="496" class="sm">Depends on how messy the old data is</text>
  <rect x="430" y="442" width="620" height="46" rx="8" fill="#f8fafc"/>
  <rect x="430" y="442" width="136" height="46" rx="8" fill="#f24d4d"/>
  <rect x="566" y="442" width="260" height="46" rx="8" fill="#f24d4d" opacity="0.18"/>
  <line x1="826" y1="436" x2="826" y2="494" stroke="#f24d4d" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="80" y="568" class="sm">Shaded extensions are range, not estimate: these two are knowable only after looking at your systems.</text>
</svg>
