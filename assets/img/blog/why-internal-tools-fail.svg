<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Why internal tools get abandoned</title>
  <desc id="d">Two rows comparing effort and benefit. In the first, the daily user does most of the data entry and gets little back, while management gets the value. In the second, the daily user gets something back on the first screen they open, and the tool survives.</desc>
  <style>
    .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 19px; fill: #475569; }
    .cap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; letter-spacing: 1.6px; text-transform: uppercase; }
    .num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
    .sm  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #64748b; }
    .nvy { fill: #0f172a; }
  </style>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="80" y="96" class="cap">How it usually gets built</text>
  <text x="80" y="160" class="lbl">The daily user</text>
  <text x="330" y="160" class="sm" text-anchor="end">effort</text>
  <rect x="345" y="142" width="260" height="24" rx="6" fill="#f8fafc"/>
  <rect x="345" y="142" width="239" height="24" rx="6" fill="#f24d4d"/>
  <text x="660" y="160" class="sm" text-anchor="end">benefit</text>
  <rect x="675" y="142" width="260" height="24" rx="6" fill="#f8fafc"/>
  <rect x="675" y="142" width="31" height="24" rx="6" fill="#33cc66"/>
  <text x="80" y="220" class="lbl">Management</text>
  <text x="330" y="220" class="sm" text-anchor="end">effort</text>
  <rect x="345" y="202" width="260" height="24" rx="6" fill="#f8fafc"/>
  <rect x="345" y="202" width="26" height="24" rx="6" fill="#f24d4d"/>
  <text x="660" y="220" class="sm" text-anchor="end">benefit</text>
  <rect x="675" y="202" width="260" height="24" rx="6" fill="#f8fafc"/>
  <rect x="675" y="202" width="247" height="24" rx="6" fill="#33cc66"/>
  <rect x="965" y="126" width="155" height="86" rx="10" fill="#ffffff" stroke="#f24d4d"/>
  <text x="1042" y="176" class="lbl" text-anchor="middle" style="fill:#f24d4d; font-weight:700">Abandoned</text>
  <line x1="80" y1="278" x2="1120" y2="278" stroke="#e2e8f0"/>
  <text x="80" y="336" class="cap">What survives contact with a team</text>
  <text x="80" y="400" class="lbl">The daily user</text>
  <text x="330" y="400" class="sm" text-anchor="end">effort</text>
  <rect x="345" y="382" width="260" height="24" rx="6" fill="#f8fafc"/>
  <rect x="345" y="382" width="143" height="24" rx="6" fill="#f24d4d"/>
  <text x="660" y="400" class="sm" text-anchor="end">benefit</text>
  <rect x="675" y="382" width="260" height="24" rx="6" fill="#f8fafc"/>
  <rect x="675" y="382" width="187" height="24" rx="6" fill="#33cc66"/>
  <text x="80" y="460" class="lbl">Management</text>
  <text x="330" y="460" class="sm" text-anchor="end">effort</text>
  <rect x="345" y="442" width="260" height="24" rx="6" fill="#f8fafc"/>
  <rect x="345" y="442" width="39" height="24" rx="6" fill="#f24d4d"/>
  <text x="660" y="460" class="sm" text-anchor="end">benefit</text>
  <rect x="675" y="442" width="260" height="24" rx="6" fill="#f8fafc"/>
  <rect x="675" y="442" width="208" height="24" rx="6" fill="#33cc66"/>
  <rect x="965" y="366" width="155" height="86" rx="10" fill="#ffffff" stroke="#33cc66"/>
  <text x="1042" y="416" class="lbl" text-anchor="middle" style="fill:#33cc66; font-weight:700">Used</text>
  <text x="80" y="560" class="sm">The fix is not more features. It is giving the person entering the data something back on the first screen they open.</text>
</svg>
